name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      # Tag v1.2.3 -> ADA_VERSION=1.2.3, and it must match Cargo.toml.
      - name: Resolve and verify version
        run: |
          $version = "${{ github.ref_name }}" -replace '^v', ''
          $match = Select-String -Path Cargo.toml -Pattern '^\s*version\s*=\s*"([^"]+)"' | Select-Object -First 1
          $cargoVersion = $match.Matches[0].Groups[1].Value
          if ($version -ne $cargoVersion) {
            Write-Error "Tag version '$version' does not match Cargo.toml version '$cargoVersion'. Bump Cargo.toml or fix the tag."
            exit 1
          }
          "ADA_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Build (release)
        run: cargo build --release --locked

      - name: Stage exe and embed icon
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item target\release\ada.exe dist\ada.exe -Force
          python tools/set_icon.py "$PWD\dist\ada.exe" "$PWD\assets\icon\ada.ico"

      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Build installer
        run: |
          # Chocolatey may install Inno Setup 6 or 7: locate ISCC.exe instead of hard-coding the path.
          $iscc = Get-ChildItem "C:\Program Files*\Inno Setup*\ISCC.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $iscc) { throw "ISCC.exe not found" }
          & $iscc.FullName installer\ada.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Compute checksums
        run: |
          $files = @("dist\ada.exe") + (Get-ChildItem dist -Filter "Ada-Setup-*.exe" | ForEach-Object { $_.FullName })
          $lines = foreach ($f in $files) {
            $hash = (Get-FileHash -Algorithm SHA256 -Path $f).Hash.ToLower()
            "$hash  $(Split-Path $f -Leaf)"
          }
          $lines | Out-File -FilePath dist\SHA256SUMS.txt -Encoding ascii
          Get-Content dist\SHA256SUMS.txt

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          name: Ada v${{ env.ADA_VERSION }}
          generate_release_notes: true
          files: |
            dist/Ada-Setup-*.exe
            dist/ada.exe
            dist/SHA256SUMS.txt
